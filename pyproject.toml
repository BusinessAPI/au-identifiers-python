[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "au-identifiers"
version = "0.1.0"
description = "Validate and format Australian identifiers: ABN, ACN, ARBN, TFN, Director ID and VIN."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "Business API", email = "dev@businessapi.com.au" }]
keywords = ["abn", "acn", "arbn", "tfn", "vin", "director-id", "australia", "validation", "checksum", "ato", "asic"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Libraries",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://businessapi.com.au"
Source = "https://github.com/BusinessAPI/au-identifiers-python"
Issues = "https://github.com/BusinessAPI/au-identifiers-python/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/au_identifiers"]

[dependency-groups]
dev = ["pytest>=8"]
